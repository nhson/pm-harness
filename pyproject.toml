[project]
name = "pm-harness"
version = "0.1.0"
description = "Agentic product management harness: layered PM agents on the Claude API"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
